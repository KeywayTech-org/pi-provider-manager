name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Build web assets
        run: npm run build

      - name: Run tests
        run: |
          node test-config.mjs
          node test-server.mjs
